dataset_root: ./Data
general_seed: 2025

input_dim: 12
features:
  0:
    - name: bar_x
    - definition: Horizontal x-axis coordinate of the barbell end in the image/frame (lateral-view).
  1:
    - name: bar_y
    - definition: Vertical y-axis coordinate of the barbell end in the image/frame (lateral-view).
  2:
    - name: left_shoulder_y
    - definition: Vertical y-axis coordinate of the left shoulder in the rear (head-back) view.
  3:
    - name: right_shoulder_y
    - definition: Vertical y-axis coordinate of the right shoulder in the rear (head-back) view.
  4:
    - name: left_dist
    - definition: Perpendicular distance from the wrist to the extended line connecting the two shoulder joints in the top-down view.
  5:
    - name: right_dist
    - definition: Perpendicular distance from the wrist to the extended line connecting the two shoulder joints in the top-down view.
  6:
    - name: left_elbow
    - definition: Elbow joint angle at the left side in the rear (head-back) view.
  7:
    - name: left_shoulder
    - definition: Shoulder joint angle at the left side in the rear (head-back) view, defined by connecting line between the two shoulder joints and upper arm.
  8:
    - name: right_elbow
    - definition: Elbow joint angle at the right side in the rear (head-back) view.
  9:
    - name: right_shoulder
    - definition: Shoulder joint angle at the right side in the rear (head-back) view, defined by connecting line between the two shoulder joints and upper arm.
  10:
    - name: left_torso-arm
    - definition: Angle at the left armpit between the torso axis and the left upper arm in the top-down view.
  11:
    - name: right_torso-arm
    - definition: Angle at the right armpit between the torso axis and the right upper arm in the top-down view.

mistakes:
  0:
    - name: wrist_bending_backward
    - definition:
  1:
    - name: tilting_to_the_left
    - definition:
        - When 'bar_y' increases 'left_elbow' decreases faster than 'right_elbow' in descent speed.
        - When 'bar_y' decreases 'right_elbow' rises faster than 'left_elbow' in ascent speed.
        - Throughout the beginning and end stages of the movement, 'right_elbow' is larger than 'left_elbow'.
  2:
    - name: tilting_to_the_right
    - definition:
        - When 'bar_y' increases 'right_elbow' decreases faster than 'left_elbow' in descent speed.
        - When 'bar_y' decreases 'left_elbow' rises faster than 'right_elbow' in ascent speed.
        - Throughout the beginning and end stages of the movement, 'left_elbow' is larger than 'right_elbow'.
  3: # 肩膀飛
    - name: scapular_protraction
    - definition:
        - The values in the final segment of 'bar_y' are significantly lower than its initial values.
        - While the values in the final segment of 'bar_y' have stopped decreasing, those of 'left_shoulder' and 'right_shoulder' continue to decline.
        - Even after the values in the final segment of 'left_elbow' and 'right_elbow' cease to rise, the values of 'left_shoulder_y' and 'right_shoulder_y' continue to decrease.
  4:
    - name: elbows_flaring
    - definition:
        - Throughout the movement, 'bar_x' possesses more than one extremum (local minima and maxima).
        - Throughout the movement, 'left_dist' and 'right_dist' remain flat (the total range < 40).

flow_dim: 128 # embedding dim flow into/in diffusion
dataset:
  split_base_num: 36
  caption: Caption_explain
vae:
  block_hidden_size: 128 # hidden size of the blocks in the network
  num_residual_layers: 3 # number of residual layers in the model
  res_hidden_size: 256 # hidden size of the residual layers
  embedding_dim: 64 # dimension of the embeddings
  epoch: 30000
diffusion:
  denoiser: DiT
  backbone: flowmatching
