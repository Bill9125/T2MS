dataset_root: ./Data
general_seed: 2025

input_dim: 8
features:
  0:
    - name: bar_x
    - definition: Horizontal x-axis coordinate of the barbell end in the image/frame (lateral-view).
  1:
    - name: bar_y
    - definition: Vertical y-axis coordinate of the barbell end in the image/frame (lateral-view).
  2:
    - name: left_knee
    - definition: Left knee joint angle formed between the left tibia and the left thigh (femur).
  3:
    - name: left_hip
    - definition: Left hip joint angle formed between the left trunk/torso and the left thigh (femur).
  4:
    - name: right_knee
    - definition: Right knee joint angle formed between the right tibia and the right thigh (femur).
  5:
    - name: right_hip
    - definition: Right hip joint angle formed between the right trunk/torso and the right thigh (femur).
  6:
    - name: left_torso_angle
    - definition: Left shoulder joint angle formed between the left humerus and the left trunk/torso.
  7:
    - name: right_torso_angle
    - definition: Right shoulder joint angle formed between the right humerus and the right trunk/torso.
mistakes:
  0:
    - name: Barbell_moving_away_from_the_shins
    - definition:
        - There is a significant difference between the initial value of 'bar_x' and the value of 'bar_x' at the point where 'bar_y' reaches its minimum.
        - The value of 'bar_x' continues to rise even when both 'left_knee' and 'right_knee' have reached their maximum values.
  1:
    - name: Hips_rising_before_the_barbell_leaves_the_ground
    - definition:
        - The values of 'left_knee' and 'right_knee' already reach their maximum before the descent of 'bar_y'.
        - Both 'left_knee' and 'right_knee' reach 80% of their maximum values before 'left_hip' and 'right_hip' reach their maximum.
  2:
    - name: Barbell_colliding_with_the_knees
    - definition:
        - while the value of 'bar_y' is decreasing, 'bar_x' exhibits significant extrema.
        - There are significant extrema in 'left_torso-arm' and 'right_torso-arm' while 'bar_y' is decreasing.
  3:
    - name: Lower_back_rounding
    - definition:
        - During the barbell descent, the knee angles reach 80% of their maximum values significantly earlier than the hip angles reach 80% of their maximum values.

flow_dim: 128
dataset:
  split_base_num: 48
  caption: Caption_explain
vae:
  block_hidden_size: 128 # hidden size of the blocks in the network
  num_residual_layers: 3 # number of residual layers in the model
  res_hidden_size: 256 # hidden size of the residual layers
  embedding_dim: 64 # dimension of the embeddings
  epoch: 30000
diffusion:
  denoiser: DiT
  backbone: flowmatching
